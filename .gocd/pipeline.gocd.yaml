format_version: 10

pipelines:
  calculator-pr-validation:
    group: defaultGroup

    materials:
      calculator-pr:
        scm: 3bef81d1-134e-4c63-a066-1348be620930
        destination: calculator

    stages:
      - PR-Quality-Gate:
          clean_workspace: true

          jobs:
            Validate-PR:
              resources:
                - pr-validation

              tasks:
                # JUnit + PMD + SpotBugs + JaCoCo
                - exec:
                    working_directory: calculator
                    command: ./scripts/pr-validate.sh

                # SonarQube Cloud PR analysis
                # Runs only if the previous task passes
                - exec:
                    working_directory: calculator
                    command: ./scripts/sonar-pr.sh

              artifacts:
                - test:
                    source: calculator/target/surefire-reports
                    destination: test-results

                - build:
                    source: calculator/target/site/jacoco
                    destination: jacoco-report

  calculator-cicd:
    group: defaultGroup

    materials:
      calculator-repo:
        git: https://github.com/Praveenkumar76/calculator.git
        branch: main
        destination: calculator

    stages:
      - Build:
          clean_workspace: true

          jobs:
            Quality-Gate:
              tasks:
                # Repeat all tests and coverage checks on merged main
                - exec:
                    working_directory: calculator
                    command: ./scripts/pr-validate.sh

                # Analyse main using the same SonarQube Cloud project
                - exec:
                    working_directory: calculator
                    command: ./scripts/sonar-main.sh

              artifacts:
                - test:
                    source: calculator/target/surefire-reports
                    destination: test-results

                - build:
                    source: calculator/target/site/jacoco
                    destination: jacoco-report

      - Docker:
          jobs:
            Build-and-Push:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-build.sh

                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-push.sh

      - Deploy:
          jobs:
            Deploy-and-Verify:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/deploy.sh

  calculator-rollback:
    group: defaultGroup

    materials:
      calculator-repo:
        git: https://github.com/Praveenkumar76/calculator.git
        branch: main
        destination: calculator
        ignore_for_scheduling: true

    stages:
      - Emergency-Rollback:
          approval: manual

          jobs:
            Emergency-Rollback:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/rollback.sh

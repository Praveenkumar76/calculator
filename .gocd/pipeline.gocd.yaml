format_version: 10

pipelines:
  calculator-cicd:
    group: defaultGroup

    materials:
      calculator-repo:
        git: https://github.com/Praveenkumar76/calculator.git
        branch: main
        destination: calculator

    stages:
      - Build:
          clean_workspace: true

          jobs:
            Quality-Gate:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/pr-validate.sh

      - Sonar:
          jobs:
            Sonar:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/sonar.sh

      - Docker:
          jobs:
            Docker:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-build.sh

                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-push.sh

      - Deploy:
          jobs:
            Deploy-and-Verify:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/deploy.sh

  calculator-rollback:
    group: defaultGroup

    materials:
      calculator-repo:
        git: https://github.com/Praveenkumar76/calculator.git
        branch: main
        destination: calculator
        ignore_for_scheduling: true

    stages:
      - Rollback:
          jobs:
            Emergency-Rollback:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/rollback.sh

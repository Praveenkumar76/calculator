format_version: 10

pipelines:
  calculator-cicd:
    group: defaultGroup

    materials:
      calculator-repo:
        git: https://github.com/Praveenkumar76/calculator.git
        branch: main
        destination: calculator

    stages:
      - Build:
          jobs:
            Build:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/build.sh

      - Sonar:
          jobs:
            Sonar:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/sonar.sh

      - Docker:
          jobs:
            Docker:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-build.sh

                - exec:
                    working_directory: calculator
                    command: ./scripts/docker-push.sh

      - Deploy:
          jobs:
            Deploy:
              tasks:
                - exec:
                    working_directory: calculator
                    command: ./scripts/deploy.sh
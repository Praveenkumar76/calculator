replicaCount: 2

image:
  repository: skycorex/calculator
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

containerPort: 8080

readinessProbe:
  path: /health

livenessProbe:
  path: /health

ingress:
  enabled: true
  host: calculator.local